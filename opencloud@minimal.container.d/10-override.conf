[Unit]
Wants=traefik@minimal.container yjs@minimal.container

[Container]
Environment=WEB_OPTION_YJS_SERVER_URL=wss://${OC_DOMAIN}/yjs

Volume=%h/.config/containers/systemd/config/opencloud/proxy.yaml:/etc/opencloud/proxy.yaml

Label=traefik.enable=true
Label=traefik.podman.network=opencloud-net
# define middleware here, to make sure its loaded with the first defined container (opencloud)
# if defined in the traefik container with a disabled dashboard it won't be loaded fast enough
Label=traefik.http.middlewares.hsts-header.headers.stsSeconds=31536000
Label=traefik.http.middlewares.hsts-header.headers.stsIncludeSubdomains=true
Label=traefik.http.middlewares.hsts-header.headers.stsPreload=true
Label=traefik.http.middlewares.hsts-header.headers.forceSTSHeader=true
Label=traefik.http.routers.opencloud.entrypoints=https
Label=traefik.http.routers.opencloud.rule=Host(`${OC_DOMAIN}`)
Label=traefik.http.routers.opencloud.service=opencloud
Label=traefik.http.routers.opencloud.middlewares=hsts-header
Label=traefik.http.services.opencloud.loadbalancer.server.port=9200
Label=traefik.http.routers.opencloud.${TRAEFIK_SERVICES_TLS_CONFIG}

[Install]

WantedBy=default.target multi-user.target
